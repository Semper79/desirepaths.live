name: CI

# Read-only by default; the deploy job is the only place that needs more, and it
# asks for it explicitly. A workflow with blanket write access is one compromised
# action away from a supply-chain incident.
permissions: read-all

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic across every job. A test that passes in one timezone and fails in
  # another is a test nobody trusts, and hour-of-week features make that a real risk.
  TZ: Europe/Rome
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback. These three run in parallel and cover everything that does not
  # need a database, which is most of the interesting code.
  # ---------------------------------------------------------------------------
  quality:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, format:check]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Coverage thresholds are enforced inside Vitest (vitest.config.ts):
      # 100% branches in packages/adaptive, 80% elsewhere. A drop fails here.
      - run: pnpm test:coverage

      # The convergence proof runs in CI, not only on a developer's machine. It is
      # deterministic, so a change in its output is a change in the engine's
      # behaviour and shows up in the log diff.
      - name: Bandit convergence harness
        run: pnpm sim

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            apps/*/dist
            apps/*/.next
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Integration. Needs the data plane, so it is slower and runs after the fast jobs.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Integration, against the stores that actually ship.
  #
  # This job used to stand up Postgres, ClickHouse and Redis and run
  # `pnpm test:integration` — a script that does not exist, against an architecture the
  # Cloudflare port removed. It had never run: the repository had no remote, so nothing
  # in this file had ever been executed. A gate that cannot run is worse than no gate,
  # because the badge is green for the wrong reason.
  #
  # What replaced it tests the real thing: Durable Objects in workerd, with real SQLite,
  # real alarm scheduling and the real single-threaded request serialisation that the
  # counters' correctness argument depends on. No services, because there are none left.
  # ---------------------------------------------------------------------------
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:workers

  # ---------------------------------------------------------------------------
  # Experience gates. These run against the ADAPTED pages, not the baseline -
  # section 7 is explicit about that, and a budget that only holds for the variant
  # nobody sees is not a budget.
  # ---------------------------------------------------------------------------
  experience:
    name: lighthouse + axe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Start the stack
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait postgres clickhouse redis redpanda
          pnpm --filter @morph/core run db:migrate
          pnpm --filter @morph/web run start &
          npx wait-on http://localhost:3000/api/health --timeout 90000
        env:
          ANON_ID_PEPPER: ci-only-pepper-not-a-secret

      # Every palette, density and layout variant is rendered and audited. A
      # generated variant that fails axe must never reach a visitor, and the
      # registry gate plus this job are the two places that guarantee it.
      - name: axe across every variant
        run: pnpm test:a11y

      - name: Lighthouse budgets
        run: pnpm exec lhci autorun
        env:
          LHCI_BUDGET_LCP_MS: '2000'
          LHCI_BUDGET_CLS: '0.05'
          LHCI_BUDGET_INP_MS: '200'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e
        env:
          ANON_ID_PEPPER: ci-only-pepper-not-a-secret
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--prod`, deliberately.
      #
      # The full tree is mostly test tooling — vitest, its pool, playwright, wrangler —
      # and an advisory in a dev dependency cannot reach a deployed Worker. Failing the
      # build on those means the gate cries wolf until somebody disables it, which is how
      # a real advisory gets missed.
      #
      # This is only defensible because the production findings are fixed rather than
      # scoped away: drizzle-orm's SQL injection advisory and Next's were both upgraded
      # when this flag was added, not hidden behind it.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # A secret in the repository is a rotation emergency, not a review comment.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The guardrails in section 0 are not merely policy. This grep is the mechanical
      # check that nobody added the forbidden capability back "temporarily".
      - name: Forbidden-capability check
        run: node scripts/check-guardrails.mjs

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, integration, experience, e2e, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Expand-only, and applied before the new Worker takes traffic: the old code must
      # be able to read the new schema, because a deploy that fails after migrating has
      # to roll back to a version that still works.
      - name: Apply D1 migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply morph --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Linux, and that is not incidental. OpenNext's standalone step symlinks the
      # dependency tree, which Windows refuses without Developer Mode or an elevated
      # shell — so the build runs here rather than on a maintainer's laptop.
      # `infra/cloudflare/README.md` has the local workaround for anyone who needs one.
      # The collector goes first. It only writes to Analytics Engine, so deploying it
      # ahead of the renderer cannot break a page — and if it fails, the renderer that
      # would have pointed visitors at it never ships.
      - name: Deploy the collector
        working-directory: apps/api
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy the renderer
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Last, and after the renderer, because this is the only script that can retire a
      # variant. If the renderer failed to deploy, a cycle that ran anyway would publish a
      # decision set the live site does not match.
      - name: Deploy the scheduled Workers
        working-directory: apps/cron
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
